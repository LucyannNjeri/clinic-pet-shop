<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Happy Paws</title>

  <link rel="stylesheet" href="style.css" />

  <!-- AOS -->
  <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
</head>

<body>

<header>
  <div class="logo-container">
    <img src="img/logo.jpg" alt="logo" loading="lazy">
    <span class="brand-name">Furry Care</span>
  </div>

  <nav>
    <ul class="nav-links">
      <li><a href="#hero">Home</a></li>
      <li><a href="#services">Services</a></li>
      <li><a href="#doctor">Vets</a></li>
      <li><a href="#footer">About</a></li>
    </ul>
  </nav>

  <div class="auth-buttons">
    <a href="#" class="login-btn">Log In</a>
    <a href="#" class="signup-btn">Sign Up</a>
  </div>
</header>

<!-- HERO -->
<section class="health-section" id="hero">
  <div class="content">
    <h1>The Pet Wellness Hub</h1>
    <h2>Pawsitive Care</h2>

    <p>We provide the best care for your pets.</p>

    <input type="email" placeholder="Enter your email" />

    <button class="sign-up">Sign Up</button>
    <button class="play-video" onclick="playVideo()">Play Video</button>
  </div>

  <div class="video-container">
    <video id="myVideo" preload="none">
      <source src="img/video.mp4" type="video/mp4">
    </video>
  </div>
</section>

<!-- STATS -->
<section class="statistics">
  <div class="banner">
    <div class="column">
      <h3 class="counter" data-target="10000">0</h3>
      <p>Pets Treated</p>
    </div>

    <div class="column">
      <h3 class="counter" data-target="300">0</h3>
      <p>Products</p>
    </div>

    <div class="column">
      <h3 class="counter" data-target="95">0</h3>
      <p>Satisfaction</p>
    </div>

    <div class="column">
      <h3 class="counter" data-target="1000">0</h3>
      <p>Emergencies</p>
    </div>
  </div>
</section>

<!-- SERVICES -->
<section id="services" class="services">
  <h1>Our Services</h1>

  <div class="cards">
    <div class="card" data-aos="fade-up">
      <img src="img/service1.jpg" loading="lazy">
      <h4>Vet Care</h4>
    </div>

    <div class="card" data-aos="fade-up">
      <img src="img/service2.jpg" loading="lazy">
      <h4>Training</h4>
    </div>

    <div class="card" data-aos="fade-up">
      <img src="img/service3.jpg" loading="lazy">
      <h4>Grooming</h4>
    </div>
  </div>
</section>

<footer id="footer">
  <p>Happy Paws © 2026</p>
</footer>

<script src="https://unpkg.com/aos@next/dist/aos.js"></script>
<script>AOS.init({ once: true });</script>

<script src="index.js" defer></script>

</body>
</html>
